<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sijie Wang — Huazhong University of Science and Technology">
  <title>Sijie Wang</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafaf8; color: #202824; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 760px; margin: 0 auto; padding: clamp(72px, 15vh, 150px) 28px 72px; }
    h1 { margin: 0 0 24px; font-size: clamp(36px, 6vw, 52px); font-weight: 600; letter-spacing: -0.04em; line-height: 1.15; }
    p { margin: 0; font-size: 18px; line-height: 1.7; }
    .affiliation { color: #59635d; max-width: 520px; }
    .contact { margin-top: 40px; padding-top: 24px; border-top: 1px solid #dce1dc; }
    .label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #59635d; text-transform: uppercase; }
    a { color: #285b47; text-decoration-thickness: 1px; text-underline-offset: 5px; overflow-wrap: anywhere; }
    a:hover { color: #172f24; }
    a:focus-visible { outline: 2px solid #285b47; outline-offset: 5px; border-radius: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Sijie Wang</h1>
    <p class="affiliation">Huazhong University of Science and Technology</p>
    <p class="contact"><span class="label">Email</span><a href="mailto:sijiewang2006@outlook.com">sijiewang2006@outlook.com</a></p>
  </main>
</body>
</html>
